<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Ken Yong: One suggestion is to add a meta description here to briefly
  describe the page. This is not required for this self assessment but I think
  it would be a good practice for SEO. -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SF Airbnb Listings</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header">
    <h1>SF Airbnb Listings</h1>
    <p class="subtitle">The first 50 San Francisco listings.</p>
  </header>

  <p id="status-message" class="status-message">Loading listings…</p>

  <!-- Ken Yong: I like how you use main as the container for the listing cards
  and let JavaScript dynamically add the listings into it. -->
  <!-- script.js fills this container with one card per listing -->
  <main id="listings-container" class="listings-grid"></main>

  <footer class="site-footer">
    <p>Data source: airbnb_sf_listings_500.json </p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
